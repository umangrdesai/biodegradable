<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 150" width="660" height="150" role="img" aria-label="BioDegradableAi">
  <title>BioDegradableAi</title>
  <defs>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D6A4F"/>
      <stop offset="1" stop-color="#1B4332"/>
    </linearGradient>
  </defs>

  <!-- ========== EMBLEM: split leaf + circuit tree, transparent bg ========== -->
  <g transform="translate(8,12)">
    <circle cx="63" cy="63" r="62" fill="none" stroke="#B7E4C7" stroke-width="2"/>

    <!-- solid leaf half (left) -->
    <path d="M63 9 C36 22 18 42 18 70 C18 96 38 116 63 117 C61 92 60 50 63 9 Z" fill="url(#leafG)"/>
    <path d="M58 24 C55 55 55 88 59 112" fill="none" stroke="#74C69D" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M57 44 L40 38 M56 62 L36 60 M57 80 L40 86 M58 98 L45 104" fill="none" stroke="#74C69D" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

    <!-- circuit tree half (right) -->
    <g fill="none" stroke="#2D6A4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M68 116 L68 70"/>
      <path d="M68 92 L84 80"/>
      <path d="M68 80 L88 66"/>
      <path d="M68 68 L82 50"/>
      <path d="M68 58 L78 40"/>
    </g>
    <g fill="#52B788">
      <circle cx="84" cy="80" r="4.2"/>
      <circle cx="88" cy="66" r="4.2"/>
      <circle cx="82" cy="50" r="4.2"/>
      <circle cx="78" cy="40" r="4.2"/>
      <circle cx="68" cy="70" r="3.4" fill="#2D6A4F"/>
    </g>
    <g fill="#74C69D">
      <path d="M90 76 q12 -3 14 -13 q-12 1 -14 13 Z"/>
      <path d="M94 62 q12 -4 13 -14 q-12 2 -13 14 Z"/>
      <path d="M88 46 q11 -5 11 -15 q-11 3 -11 15 Z"/>
      <path d="M84 36 q10 -6 9 -16 q-10 4 -9 16 Z"/>
    </g>
    <g fill="#B7E4C7">
      <path d="M90 90 q11 -2 13 -11 q-11 1 -13 11 Z"/>
    </g>
  </g>

  <!-- ========== WORDMARK ========== -->
  <text x="150" y="92"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-0.8">
    <tspan fill="#1B4332">BioDegradable</tspan><tspan fill="#52B788" dx="3">Ai</tspan>
  </text>
  <!-- small leaf accent above the 'i' -->
  <path d="M641 40 q11 -3 12 -12 q-11 1 -12 12 Z" fill="#74C69D"/>
